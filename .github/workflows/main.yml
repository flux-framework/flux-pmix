on: [ pull_request, push ]
name: ci
jobs:
  check-pr:
    name: validate commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - run: git fetch origin main
    - uses: flux-framework/pr-validator@master

  ci-checks:
    runs-on: ubuntu-latest
    env:
      TAP_DRIVER_QUIET: 1
      FLUX_TEST_TIMEOUT: 300
    timeout-minutes: 20
    strategy:
      matrix:
        include:
        - name: "jammy - chain_lint"
          image: "jammy"
          openpmix_server: ""
          openpmix_client: "v5.0.9"
          ompi: "v5.0.9"
          configure_args: ""
          coverage: false
          env:
            chain_lint: t
        - name: "el8 - distcheck"
          image: "el8"
          openpmix_server: ""
          openpmix_client: "v5.0.9"
          ompi: "v5.0.9"
          configure_args: ""
          coverage: false
          env:
            DISTCHECK: t
        - name: "el8 - ompi v4.1.4"
          image: "el8"
          openpmix_server: ""
          openpmix_client: "v3.2.5"
          ompi: "v4.1.4"
          configure_args: ""
          coverage: false
          env: {}
        - name: "jammy - coverage"
          image: "jammy"
          openpmix_server: ""
          openpmix_client: "v5.0.9"
          ompi: "v5.0.9"
          configure_args: ""
          coverage: true
          env:
            COVERAGE: t
        - name: "fedora40 - ompi v5"
          image: "fedora40"
          openpmix_server: ""
          openpmix_client: "v5.0.9"
          ompi: "v5.0.9"
          configure_args: ""
          coverage: false
          env: {}
        - name: "el9 - ompi v5"
          image: "el9"
          openpmix_server: ""
          openpmix_client: "v5.0.9"
          ompi: "v5.0.9"
          configure_args: ""
          coverage: false
          env: {}
        - name: "jammy - openpmix v7.0.0rc1"
          image: "jammy"
          openpmix_server: ""
          openpmix_client: "v7.0.0rc1"
          ompi: "v6.0.0rc2"
          configure_args: ""
          coverage: false
          env: {}
        - name: "el9 - native ompi 4.1 pmix 3.2"
          image: "el9"
          openpmix_server: ""
          openpmix_client: ""
          ompi: ""
          configure_args: ""
          coverage: false
          env: {}
        - name: "el10 - native ompi 5.0 pmix 4.2"
          image: "el10"
          openpmix_server: ""
          openpmix_client: ""
          ompi: ""
          configure_args: ""
          coverage: false
          env: {}
        - name: "jammy - ompi v4.1.x"
          image: "jammy"
          openpmix_server: ""
          openpmix_client: "v4.2.2"
          ompi: "v4.1.x"
          configure_args: ""
          coverage: false
          env: {}
        - name: "jammy - ompi v4.0.x"
          image: "jammy"
          openpmix_server: ""
          openpmix_client: "v4.2.2"
          ompi: "v4.0.x"
          configure_args: ""
          coverage: false
          env: {}

      fail-fast: false
    name: ${{ matrix.name }}
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
       ref: ${{ github.event.pull_request.head.sha }}
       fetch-depth: 0

    - name: docker-run-checks
      env: ${{ matrix.env }}
      run: >
        ./src/test/docker/docker-run-checks.sh
        -j $(nproc)
        -i ${{ matrix.image }}
        --build-arg OPENPMIX_SERVER=${{ matrix.openpmix_server }}
        --build-arg OPENPMIX_CLIENT=${{ matrix.openpmix_client }}
        --build-arg OMPI=${{ matrix.ompi }}
        -- ${{ matrix.configure_args }}

    - name: annotate errors
      if: failure() || cancelled()
      run: src/test/checks-annotate.sh

    - name: coverage report
      if: success() && matrix.coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: create release
      if: |
        success()
        && github.ref_type == 'tag'
        && matrix.env.DISTCHECK == 't'
        && github.repository == 'flux-framework/flux-pmix'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: flux-pmix ${{ github.ref_name }}
        prerelease: true
        files: flux-pmix*.tar.gz
        body: |
          View [Release Notes](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/NEWS.md) for flux-pmix ${{ github.ref_name }}
